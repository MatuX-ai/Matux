<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg-gradient)" rx="12"/>
  
  <!-- 显示屏 -->
  <rect x="100" y="80" width="200" height="120" fill="#2d3748" rx="8"/>
  <rect x="110" y="90" width="180" height="100" fill="#1a202c" rx="4"/>
  
  <!-- 数据显示 -->
  <text x="130" y="115" font-family="Arial, sans-serif" font-size="14" fill="#48bb78">🌡️ 温度: 24°C</text>
  <text x="130" y="140" font-family="Arial, sans-serif" font-size="14" fill="#667eea">💧 湿度: 65%</text>
  <text x="130" y="165" font-family="Arial, sans-serif" font-size="14" fill="#f56565">🌫️ PM2.5: 35</text>
  <text x="130" y="190" font-family="Arial, sans-serif" font-size="14" fill="#4a5568">☀️ 光照: 850Lux</text>
  
  <!-- 传感器图标 -->
  <circle cx="120" cy="220" r="15" fill="#48bb78" opacity="0.3"/>
  <text x="120" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">🌡️</text>
  
  <circle cx="160" cy="220" r="15" fill="#667eea" opacity="0.3"/>
  <text x="160" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">💧</text>
  
  <circle cx="200" cy="220" r="15" fill="#f56565" opacity="0.3"/>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">️</text>
  
  <circle cx="240" cy="220" r="15" fill="#4a5568" opacity="0.3"/>
  <text x="240" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">☀️</text>
  
  <!-- 底座 -->
  <rect x="140" y="240" width="120" height="20" fill="#2d3748" rx="4"/>
  
  <!-- 标题 -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748" text-anchor="middle">环境监测站</text>
  
  <!-- 标签 -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="12" fill="#667eea" text-anchor="middle">#传感器 #环境监测 #创客作品</text>
</svg>
