<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg-gradient)" rx="12"/>
  
  <!-- 风扇主体 -->
  <circle cx="200" cy="140" r="70" fill="#2d3748" opacity="0.9"/>
  <circle cx="200" cy="140" r="60" fill="#4a5568"/>
  
  <!-- 风扇叶片 -->
  <g transform="translate(200, 140)">
    <ellipse cx="0" cy="-35" rx="15" ry="30" fill="#667eea" opacity="0.8"/>
    <ellipse cx="30" cy="17" rx="15" ry="30" fill="#667eea" opacity="0.8" transform="rotate(120)"/>
    <ellipse cx="-30" cy="17" rx="15" ry="30" fill="#667eea" opacity="0.8" transform="rotate(240)"/>
  </g>
  
  <!-- 中心圆 -->
  <circle cx="200" cy="140" r="15" fill="#1a202c"/>
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="10" fill="#48bb78" text-anchor="middle">T</text>
  
  <!-- 温度传感器 -->
  <rect x="130" y="80" width="40" height="30" fill="#4a5568" rx="3"/>
  <text x="150" y="100" font-family="Arial, sans-serif" font-size="10" fill="#48bb78" text-anchor="middle">25°C</text>
  
  <!-- 控制按钮 -->
  <rect x="240" y="80" width="50" height="25" fill="#48bb78" rx="4"/>
  <text x="265" y="96" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">AUTO</text>
  
  <!-- 底座 -->
  <rect x="160" y="210" width="80" height="20" fill="#2d3748" rx="4"/>
  
  <!-- 标题 -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748" text-anchor="middle">智能温控风扇</text>
  
  <!-- 标签 -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="12" fill="#667eea" text-anchor="middle">#物联网 #智能家居 #创客作品</text>
</svg>
