<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg-gradient)" rx="12"/>
  
  <!-- 电路板底板 -->
  <rect x="100" y="80" width="200" height="140" fill="#2d3748" rx="8" filter="url(#shadow)"/>
  
  <!-- ESP32 芯片 -->
  <rect x="140" y="100" width="60" height="40" fill="#1a202c" rx="4"/>
  <text x="170" y="125" font-family="Arial, sans-serif" font-size="12" fill="#48bb78" text-anchor="middle">ESP32</text>
  
  <!-- 传感器图标 -->
  <rect x="220" y="100" width="40" height="30" fill="#4a5568" rx="3"/>
  <circle cx="240" cy="115" r="8" fill="#48bb78"/>
  <text x="240" y="118" font-family="Arial, sans-serif" font-size="6" fill="#fff" text-anchor="middle">💧</text>
  
  <!-- 水泵 -->
  <rect x="140" y="160" width="50" height="40" fill="#4a5568" rx="3"/>
  <text x="165" y="185" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">⛲</text>
  
  <!-- 土壤湿度显示 -->
  <rect x="220" y="160" width="60" height="30" fill="#2d3748" rx="3"/>
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="10" fill="#48bb78" text-anchor="middle">湿度: 65%</text>
  
  <!-- 连接线 -->
  <line x1="200" y1="120" x2="220" y2="120" stroke="#48bb78" stroke-width="2"/>
  <line x1="165" y1="140" x2="165" y2="160" stroke="#48bb78" stroke-width="2"/>
  <line x1="200" y1="175" x2="220" y2="175" stroke="#48bb78" stroke-width="2"/>
  
  <!-- 自动浇花系统标题 -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748" text-anchor="middle">自动浇花系统</text>
  
  <!-- IoT 标识 -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="12" fill="#667eea" text-anchor="middle">#物联网 #自动化 #创客作品</text>
</svg>
