[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matux-backend"
version = "1.0.0"
description = "MatuX STEM Learning Tool - Backend Services"
authors = [{name = "MatuX Lab"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.12.0",
    "flake8-docstrings>=1.7.0",
    "flake8-import-order>=0.18.2",
    "flake8-print>=5.0.0",
    "flake8-quotes>=3.3.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=3.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["backend", "tests"]
known_third_party = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "celery",
    "redis",
    "alembic",
    "uvicorn",
    "pytest"
]
sections = [
    "FUTURE",
    "STDLIB", 
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
no_lines_before = ["LOCALFOLDER"]
force_sort_within_sections = true
combine_as_imports = true

[tool.flake8]
max-line-length = 88
max-complexity = 10
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # mccabe
    "B",      # flake8-bugbear
    "Q",      # flake8-quotes
    "T20",    # flake8-print
]
extend-ignore = [
    "E203",   # whitespace before ':'
    "E501",   # line too long (handled by black)
    "W503",   # line break before binary operator
    "C901",   # function is too complex (handled separately)
]
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "build",
    ".venv",
    "venv",
    "migrations",
    "alembic",
]
per-file-ignores = [
    "__init__.py:F401",           # imported but unused in __init__.py
    "tests/*:S101,T201",          # asserts and prints in tests
    "*/conftest.py:S101",         # asserts in conftest
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
    "migrations.*"
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# =============================================================================
# pytest 配置说明
# =============================================================================
# pytest 的唯一配置源为 backend/pytest.ini（单一配置源）。
# 本文件不再声明 backend/pytest.ini 中已有的 pythonpath / testpaths /
# python_files / markers / addopts，避免双配置互相覆盖，原因：
#   1. 双配置打架：根配置曾通过 testpaths 额外拉入根目录下的 tests/，
#      而 backend/pytest.ini 的配置均以 rootdir=backend 为基准，
#      两份配置叠加时 rootdir 与收集范围互相覆盖；
#   2. 根配置 addopts 里的 --cov=backend 依赖 pytest-cov，未安装时
#      pytest 直接以 usage error（EXIT=4）退出，无法给出任何有效信息；
#   3. 根目录 tests/ 目录下的用例与 backend/tests/ 不同源，
#      混入会导致用例数与失败数在不同 CWD 下对不上（多出 8 项）。
#
# 仓库根目录不是测试入口：此处仅保留两条最小护栏，
#   - norecursedirs: 禁止从根目录递归收集子目录；
#   - --noconftest: 不加载 conftest.py。
# 二者共同保证误在仓库根执行 pytest 时得到明确的 "no tests collected"（EXIT=5），
# 而不是 usage error（EXIT=4）或全仓库递归扫描触发的 INTERNALERROR
# （pytest 会无条件加载锚点目录下 test* 子目录的 conftest.py，
#   而根目录 tests/conftest.py 中的 pytest_xdist_setupnodes 钩子在未安装
#   pytest-xdist 时会触发 PluginValidationError）。
# 正确的执行方式：cd backend && pytest（配置见 backend/pytest.ini）。
[tool.pytest.ini_options]
addopts = "--noconftest"
norecursedirs = ["*"]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/conftest.py",
    "*/settings.py",
    "*/config.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"