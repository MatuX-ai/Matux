[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matux-backend"
version = "1.0.0"
description = "MatuX STEM Learning Tool - Backend Services"
authors = [{name = "MatuX Lab"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "isort==9.0.2",
    "flake8==7.5.0",
    "flake8-bugbear==26.10.27",
    "flake8-comprehensions==3.17.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1.post1",
    "pre-commit==4.7.0",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["backend", "tests"]
known_third_party = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "celery",
    "redis",
    "alembic",
    "uvicorn",
    "pytest"
]
sections = [
    "FUTURE",
    "STDLIB", 
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
no_lines_before = ["LOCALFOLDER"]
force_sort_within_sections = true
combine_as_imports = true

# =============================================================================
# ruff 配置说明
# =============================================================================
# ruff 与 flake8 各司其职，配置必须同步：
#   - flake8：CI 门禁的唯一执行者，配置在仓库根 .flake8（flake8 不读取本文件）
#   - ruff：批量机械修复（--fix）的执行者，配置在本文件的 [tool.ruff]
# 排除项 / 忽略项 / per-file-ignores 三者保持一致，避免两条工具互相打架。
#
# target-version 必须显式声明：ruff 默认按 py38 解析，会把
# "with (a, b):" 这类 Python 3.9+ 合法语法误报为 invalid-syntax。
[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "backend/venv",
    "backend/.venv",
    "backend/marketing_api/venv",
    "backend/notebooks",
    "backend/migrations",
    "backend/alembic",
    "backend/__pycache__",
]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B"]
# 注：W503（line break before binary operator）在 ruff 中不存在，故不列入；
# E501 由 line-length 统一控制，B008 为 FastAPI Depends 惯用法。
ignore = ["E203", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 中的 import 用于对外 re-export，不能删除
"backend/**/__init__.py" = ["F401"]
# test_shared_utils.py 用通配符导入（脚本需要被导入模块的全部函数），
# F405 报在使用处而非 import 行，行内 noqa 无法抑制，故按文件忽略。
"backend/utils/test_shared_utils.py" = ["F405"]
# 与根目录 .flake8 的 per-file-ignores 保持同一份清单：
# 这些文件的 W293（空白行上的行尾空白）全部落在多行字符串内部
# （prompt 模板 / SVG 模板 / docstring），物理行去空白会改变运行时的
# 字符串内容，因此按文件忽略。
# ruff 的 glob 相对于本文件所在目录（仓库根），因此使用完整相对路径；
# 而 flake8 侧的同名 pattern 必须是 basename 形式（flake8 按 CWD 绝对化）。
"backend/services/token_service.py" = ["W293"]
"backend/services/admin_settings_service.py" = ["W293"]
"backend/ai_service/creativity_engine.py" = ["W293"]
"backend/ai_service/idea_scorer.py" = ["W293"]
"backend/services/user_license_service.py" = ["W293"]
"backend/services/task_orchestration_service.py" = ["W293"]
"backend/tests/test_task_orchestration_hardware.py" = ["W293"]
"backend/services/badge_generator.py" = ["W293"]
"backend/services/payment_service.py" = ["W293"]
"backend/ai_service/business_evaluator.py" = ["W293"]
"backend/middleware/enhanced_permission_middleware.py" = ["W293"]
"backend/routes/admin_settings_routes.py" = ["W293"]
"backend/ai_service/performance_optimizer.py" = ["W293"]
"backend/core/plugin_manager.py" = ["W293"]
"backend/routes/ai_routes.py" = ["W293"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
    "migrations.*"
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# =============================================================================
# pytest 配置说明
# =============================================================================
# pytest 的唯一配置源为 backend/pytest.ini（单一配置源）。
# 本文件不再声明 backend/pytest.ini 中已有的 pythonpath / testpaths /
# python_files / markers / addopts，避免双配置互相覆盖，原因：
#   1. 双配置打架：根配置曾通过 testpaths 额外拉入根目录下的 tests/，
#      而 backend/pytest.ini 的配置均以 rootdir=backend 为基准，
#      两份配置叠加时 rootdir 与收集范围互相覆盖；
#   2. 根配置 addopts 里的 --cov=backend 依赖 pytest-cov，未安装时
#      pytest 直接以 usage error（EXIT=4）退出，无法给出任何有效信息；
#   3. 根目录 tests/ 目录下的用例与 backend/tests/ 不同源，
#      混入会导致用例数与失败数在不同 CWD 下对不上（多出 8 项）。
#
# 仓库根目录不是测试入口：此处仅保留两条最小护栏，
#   - norecursedirs: 禁止从根目录递归收集子目录；
#   - --noconftest: 不加载 conftest.py。
# 二者共同保证误在仓库根执行 pytest 时得到明确的 "no tests collected"（EXIT=5），
# 而不是 usage error（EXIT=4）或全仓库递归扫描触发的 INTERNALERROR
# （pytest 会无条件加载锚点目录下 test* 子目录的 conftest.py，
#   而根目录 tests/conftest.py 中的 pytest_xdist_setupnodes 钩子在未安装
#   pytest-xdist 时会触发 PluginValidationError）。
# 正确的执行方式：cd backend && pytest（配置见 backend/pytest.ini）。
[tool.pytest.ini_options]
addopts = "--noconftest"
norecursedirs = ["*"]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/conftest.py",
    "*/settings.py",
    "*/config.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"