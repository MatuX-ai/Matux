<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MatuX Design System</title>
    <!-- 【P0 修复 #13】使用绝对路径 / 替代 ./：
         - HTTP 部署: http://localhost:8080/foo/index.html → / 解析为 http://localhost:8080/
           即使刷新深层路由（如 /auth/login），脚本也始终从根路径加载，避开 SPA fallback 把 HTML 误当 JS 返回的问题。
         - Electron app:// 协议: app://./index.html → / 解析为 app://./，行为与 ./ 一致；
           且 Electron 自定义协议 SPA fallback 会把 index.html/<x> 重定向到 <x>，与绝对 base href 配合更稳。
         - 历史相对路径兼容：构建输出仍包含 main 等同源资源，不受 base href 切换影响。 -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="assets/branding/logo.svg" />

    <!-- PWA 配置 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="MatuX STEM 学习工具 - 支持离线学习的现代化教育系统" />

    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iMatu 离线版" />

    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#059669" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />

    <!-- Material Icons - 已本地化通过 @fontsource 加载（见 angular.json） -->

    <!-- Remix Icon (本地化，从 node_modules/remixicon 引入，见 angular.json) -->

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Geist Fonts (与原型站一致) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 2rem">
        <h2>需要启用JavaScript</h2>
        <p>请启用JavaScript以使用MatuX平台的所有功能。</p>
      </div>
    </noscript>
    <app-root></app-root>
  </body>
</html>
