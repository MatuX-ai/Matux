<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1 class="register-title">创建账号</h1>
      <p class="register-subtitle">加入 MatuX 智能学习平台</p>
    </div>

    <form class="register-form" (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          [(ngModel)]="userData.username"
          (blur)="validateUsername()"
          required
          minlength="3"
          placeholder="请输入用户名（至少3个字符）"
        />
        <div class="error-message" *ngIf="usernameError">
          {{ usernameError }}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">邮箱</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          [(ngModel)]="userData.email"
          (blur)="validateEmail()"
          required
          email
          placeholder="请输入邮箱地址"
        />
        <div class="error-message" *ngIf="emailError">
          {{ emailError }}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            class="form-input"
            [(ngModel)]="userData.password"
            (blur)="validatePassword()"
            required
            placeholder="请输入密码（至少8位，含字母和数字）"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword"
            tabindex="-1"
          >
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div class="error-message" *ngIf="passwordError">
          {{ passwordError }}
        </div>
        <div class="password-hint" *ngIf="!passwordError">
          <mat-icon>info</mat-icon>
          至少 8 个字符，必须同时包含字母和数字
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">确认密码</label>
        <div class="password-input-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
            [(ngModel)]="confirmPassword"
            (blur)="confirmPasswordTouched = true"
            required
            placeholder="请再次输入密码"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showConfirmPassword = !showConfirmPassword"
            tabindex="-1"
          >
            <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div class="error-message" *ngIf="confirmPasswordMismatch">两次输入的密码不一致</div>
      </div>

      <div class="terms-group">
        <label class="terms-label">
          <input
            type="checkbox"
            name="agreeTerms"
            [(ngModel)]="agreeTerms"
            required
            class="terms-checkbox"
          />
          <span class="terms-text">
            我已阅读并同意
            <a href="#" class="terms-link" (click)="$event.preventDefault()">《服务条款》</a>
            和
            <a href="#" class="terms-link" (click)="$event.preventDefault()">《隐私政策》</a>
          </span>
        </label>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-alert" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" class="register-button" [disabled]="loading || !isFormValid">
        <span *ngIf="!loading">注册</span>
        <span *ngIf="loading" class="loading-spinner"></span>
      </button>
    </form>

    <div class="login-link">
      <span>已有账号？</span>
      <a [routerLink]="ROUTES.AUTH.LOGIN">立即登录</a>
    </div>
  </div>
</div>
