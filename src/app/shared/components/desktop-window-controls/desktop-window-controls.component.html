<!-- 无边框窗口控制按钮组（Windows 11 风格）：最小化 / 最大化-还原 / 关闭 -->
<div class="window-controls" *ngIf="visible" role="group" aria-label="窗口控制">
  <button
    type="button"
    class="wc-btn wc-minimize"
    title="最小化"
    aria-label="最小化"
    (click)="minimize()"
  >
    <svg class="wc-icon" viewBox="0 0 10 10" aria-hidden="true">
      <path d="M0 5h10" />
    </svg>
  </button>

  <button
    type="button"
    class="wc-btn wc-maximize"
    [title]="isMaximized ? '向下还原' : '最大化'"
    [attr.aria-label]="isMaximized ? '向下还原' : '最大化'"
    [attr.aria-pressed]="isMaximized"
    (click)="toggleMaximize()"
  >
    <svg *ngIf="!isMaximized" class="wc-icon" viewBox="0 0 10 10" aria-hidden="true">
      <rect x="0.5" y="0.5" width="9" height="9" />
    </svg>
    <svg *ngIf="isMaximized" class="wc-icon" viewBox="0 0 10 10" aria-hidden="true">
      <path d="M2.5 2.5V0.5h7v7h-2" />
      <rect x="0.5" y="2.5" width="7" height="7" />
    </svg>
  </button>

  <button
    type="button"
    class="wc-btn wc-close"
    title="关闭"
    aria-label="关闭"
    (click)="close()"
  >
    <svg class="wc-icon" viewBox="0 0 10 10" aria-hidden="true">
      <path d="M0 0l10 10M10 0L0 10" />
    </svg>
  </button>
</div>
