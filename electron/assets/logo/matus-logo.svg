<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0e1a" rx="80"/>
  
  <!-- Ice Cube -->
  <rect x="106" y="106" width="300" height="300" rx="40" fill="url(#iceGradient)"/>
  
  <!-- Ice Cube Shine -->
  <rect x="126" y="126" width="120" height="120" rx="20" fill="url(#shineGradient)"/>
  
  <!-- Ice Cube Inner Lines -->
  <path d="M 156 356 L 356 156" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" fill="none"/>
  <path d="M 256 106 L 256 406" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" fill="none"/>
  <path d="M 106 256 L 406 256" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" fill="none"/>
  
  <!-- Subtle Glow -->
  <rect x="106" y="106" width="300" height="300" rx="40" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.5"/>
</svg>