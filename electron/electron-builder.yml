appId: com.imato.desktop
productName: iMato
directories:
  # 【需求】安装包输出到项目根的 release/ 目录，便于统一分发
  output: ../release
  buildResources: build
files:
  - package.json
  - "*.js"
  - "*.html"
  - "config/**/*"
  - "src/**/*"
  - "services/**/*"
  - "utils/**/*"
  - "ui/**/*"
  - "ipc/**/*"
  - "bootstrap/**/*"
  - "core/**/*"
  - "security.js"
  - "build/**/*"
  # 注意：不要在 files 里写 "../dist/**/*"
  # electron-builder 默认会拒绝/静默忽略跳出 app 根目录的相对路径
  # 前端 dist 必须通过 extraResources 单独打包（见下方）
asar: true
extraResources:
  - from: "../backend"
    to: "backend"
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/venv/**"
      - "!**/.env"
      - "!**/tests/**"
  # 【修复 1.0.2 蓝屏】前端 dist 作为外部资源打包，避免 ../dist/**/* 被忽略导致
  # 安装包内没有 index.html，主窗口 ready-to-show 永远不触发 → 用户看到"蓝屏"
  - from: "../dist/imatuproject"
    to: "dist/imatuproject"
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  # 【需求】在安装成功结束后弹窗提醒用户安装 Python 3.9+
  # installer.nsh 使用 NSIS 标准 .onInstSuccess 钩子
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true