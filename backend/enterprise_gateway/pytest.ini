# 企业 API 网关是独立可部署服务（见 enterprise_gateway/Dockerfile、docker-compose.yml）：
# 其模块统一使用顶层导入（from models.enterprise_models import ...），
# 因此必须以 enterprise_gateway/ 作为导入根目录单独运行：
#
#   cd backend/enterprise_gateway
#   python -m pytest
#
# 不能放进 backend 主测试会话：backend/ 在 sys.path 中时，
# enterprise_gateway 的 models/services/utils 会遮蔽 backend 的同名包。
[pytest]
# 测试路径（相对 rootdir=enterprise_gateway 解析）
testpaths = tests

# . = enterprise_gateway/（服务自身），.. = backend/（共享的 config 包）
pythonpath = . ..

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    -p no:warnings
    --strict-markers

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    security: marks tests as security tests
    e2e: marks tests as end-to-end tests

norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    migrations
    venv
    .venv
    node_modules
    reports
    grafana
    nginx
    prometheus
    init-scripts
    ssl
