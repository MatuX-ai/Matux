# pytest 配置 - 单元测试与覆盖率统计
[pytest]
# 测试路径（相对 rootdir=backend 解析）
# 注：enterprise_gateway 是独立可部署服务（有自己的 Dockerfile / docker-compose），
#     其模块使用顶层导入，必须在 enterprise_gateway/ 目录下单独收集，
#     否则会遮蔽 backend 的 models/services/utils 包。
testpaths =
    tests
    gamification/tests

# 将 rootdir(=backend) 加入 sys.path，
# 保证 `from models.X import` / `from services.X import` / `from utils.X import`
# 这类顶层导入在 `pytest` 与 `python -m pytest` 两种启动方式下行为一致
pythonpath = .

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数
addopts =
    -v
    --tb=short
    # Temporarily disabled for testing
    # --cov=backend
    # --cov-report=html:reports/coverage_html
    # --cov-report=xml:reports/coverage.xml
    # --cov-report=term-missing
    # --cov-fail-under=50
    # --junit-xml=reports/test-results.xml
    -p no:warnings
    --strict-markers

# 自定义标记
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    security: marks tests as security tests
    e2e: marks tests as end-to-end tests

# 忽略的文件/目录
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    migrations
    venv
    marketing_api/venv
    .venv
    node_modules

#  fixtures 自动使用
usefixtures =

# 控制台输出配置
console_output_style = count
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 超时配置 (秒)
timeout = 300

# 并行执行 (如需加速)
# addopts = ... --numprocesses=auto
