# pytest 配置 - 单元测试与覆盖率统计
[pytest]
# 测试路径（相对 rootdir=backend 解析）
# 注：enterprise_gateway 是独立可部署服务（有自己的 Dockerfile / docker-compose），
#     其模块使用顶层导入，必须在 enterprise_gateway/ 目录下单独收集，
#     否则会遮蔽 backend 的 models/services/utils 包。
testpaths =
    tests
    gamification/tests

# 将 rootdir(=backend) 加入 sys.path，
# 保证 `from models.X import` / `from services.X import` / `from utils.X import`
# 这类顶层导入在 `pytest` 与 `python -m pytest` 两种启动方式下行为一致
pythonpath = .

# 测试文件匹配规则
# 说明：此处只收集 test_*.py，不使用 pytest 默认的 `test_*.py *_test.py`。
# backend/tests 下的 *_test.py 文件是手工调试脚本而非正式用例
# （如 quick_test.py 内含写死的密钥断言，simple_user_license_test.py、
# avatar_integration_test.py 为独立场景脚本），若恢复 pytest 默认模式会：
#   - 收集用例数由 1239 增至 1264（+25），与「双 CWD 用例数一致」的基线冲突；
#   - 额外引入 1 个失败用例（tests/quick_test.py::test_license_key_validation）。
# 故保持与基线一致，仅收集 test_*.py。
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数
addopts =
    -v
    --tb=short
    # Temporarily disabled for testing
    # --cov=backend
    # --cov-report=html:reports/coverage_html
    # --cov-report=xml:reports/coverage.xml
    # --cov-report=term-missing
    # --cov-fail-under=50
    # --junit-xml=reports/test-results.xml
    -p no:warnings
    # 禁用 pytest-flask：其 autouse fixture 会给 app 打 response_class 补丁，
    # 而本仓库的 app 是 FastAPI 实例（无 response_class 属性），导致 setup 阶段 21 个 ERROR。
    -p no:flask
    --strict-markers

# 自定义标记
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    security: marks tests as security tests
    e2e: marks tests as end-to-end tests

# 忽略的文件/目录
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    migrations
    venv
    marketing_api/venv
    .venv
    node_modules

#  fixtures 自动使用
usefixtures =

# 控制台输出配置
console_output_style = count
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 超时配置 (秒)
timeout = 300

# 并行执行 (如需加速)
# addopts = ... --numprocesses=auto
